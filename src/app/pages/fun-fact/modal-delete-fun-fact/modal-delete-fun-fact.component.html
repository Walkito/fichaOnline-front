<div class="alert-box">
  <h1 class="alert-title">Atenção!</h1>
  <h2 class="alert-content">Tem certeza que deseja excluir o fato selecionado? </h2>
  <div class="alert-buttons">
    <button class="btn-yes" (click)="optionSelection(0)">Sim</button>
    <button class="btn-no" (click)="optionSelection(1)">Não</button>
  </div>
</div>
